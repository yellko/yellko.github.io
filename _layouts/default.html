<!DOCTYPE html>
<html>
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
    <meta name="robots" content="noindex, nofollow">
    {% include meta.html %}
    <meta property="og:image" content="{{ site.baseurl }}/images/logo.png" />
    <link rel="icon" href="{{ site.baseurl }}/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />

    <!-- Created with Jekyll Now - http://github.com/barryclark/jekyll-now -->
  </head>

  <body>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix">
          <a href="{{ site.baseurl }}/" class="site-avatar"><img src="{{ site.avatar }}" /></a>
			<a href="https://yellko.github.io/links/" class="konnect-badge" aria-label="Alle meine Links" title="KO'NNECT">
			  <img src="{{ site.baseurl }}/images/konnect-icon.png" alt="KO'NNECT">
			</a>
          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav>
            <a href="{{ site.baseurl }}/">↑BLOG</a>
            <a href="{{ site.baseurl }}/about">KO</a>
           <!-- <a href="https://www.tiktok.com/@yell.ko/live/">TIKTOK</a> -->
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
		<footer class="footer mt-10 text-center text-sm opacity-50">
    		<!-- {% include svg-icons.html %} -->
   		 <a href="/impressum/" class="underline">Impressum</a>
		</footer>
      </div>
    </div>

    {% include analytics.html %}
  </body>
</html>
